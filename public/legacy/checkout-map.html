<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose delivery location | Jora</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="jora-shell.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>.picker{max-width:760px;margin:0 auto;padding:22px 16px 110px}.picker-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.picker-head h1{margin:0;font-size:clamp(1.55rem,5vw,2.3rem)}#picker-map{height:min(62vh,560px);border:1px solid var(--j-line);border-radius:18px;overflow:hidden;background:#e9f8ee}.picker-note{margin:12px 0;padding:12px 14px;border-radius:12px;background:#fbf7ff;color:var(--j-muted);font-size:.86rem}.picker-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.picker-actions button{min-height:48px;border-radius:12px;font:800 .9rem var(--j-sans);cursor:pointer}.picker-secondary{border:1px solid var(--j-line);background:var(--j-card);color:var(--j-ink)}@media(max-width:480px){.picker-actions{grid-template-columns:1fr}}</style></head><body><main class="picker"><div class="picker-head"><div><h1>Choose delivery location</h1><p style="margin:6px 0 0;color:var(--j-muted)">Tap or drag the pin to your exact delivery point.</p></div><a class="jora-back" href="checkout.html" style="margin:0">← Back</a></div><div id="picker-map" aria-label="Delivery location map"></div><p class="picker-note" id="picker-note">Move the pin, then save your delivery location.</p><div class="picker-actions"><button class="picker-secondary" id="locate" type="button">Use my current location</button><button class="jora-button" id="save" type="button">Save delivery location</button></div></main><script>(function(){var lat=Number(localStorage.getItem('ls_del_lat')),lng=Number(localStorage.getItem('ls_del_lng'));if(!Number.isFinite(lat)||!Number.isFinite(lng)){lat=11.0168;lng=76.9558}var map=L.map('picker-map').setView([lat,lng],15),marker=L.marker([lat,lng],{draggable:true}).addTo(map).bindPopup('Delivery here').openPopup(),note=document.getElementById('picker-note');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);function set(point){lat=point.lat;lng=point.lng;marker.setLatLng(point);note.textContent='Pinned: '+lat.toFixed(5)+', '+lng.toFixed(5)}map.on('click',function(e){set(e.latlng)});marker.on('dragend',function(){set(marker.getLatLng())});set({lat:lat,lng:lng});document.getElementById('locate').onclick=function(){if(!navigator.geolocation){note.textContent='Location access is unavailable. Move the pin manually.';return}note.textContent='Finding your location…';navigator.geolocation.getCurrentPosition(function(p){set({lat:p.coords.latitude,lng:p.coords.longitude});map.setView([lat,lng],16)},function(){note.textContent='Could not detect your location. Move the pin manually.'},{enableHighAccuracy:true,timeout:10000})};document.getElementById('save').onclick=function(){localStorage.setItem('ls_del_lat',String(lat));localStorage.setItem('ls_del_lng',String(lng));location.replace('checkout.html')};}())</script></body></html>
