<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose delivery location | Jora</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="jora-shell.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>.picker{max-width:760px;margin:auto;padding:22px 16px 110px}.picker-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:16px}.picker-head h1{margin:0;font-size:clamp(1.55rem,5vw,2.3rem)}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.search input{min-width:0;min-height:48px;padding:0 14px;border:1px solid var(--j-line);border-radius:12px;background:var(--j-card);color:var(--j-ink);font:inherit}.search button,.picker-actions button{min-height:48px;padding:0 16px;border-radius:12px;font:800 .9rem var(--j-sans);cursor:pointer}.search button{border:0;background:var(--j-primary);color:#082714}.results{display:grid;gap:6px;margin:-4px 0 12px}.results button{padding:11px 13px;border:1px solid var(--j-line);border-radius:10px;background:var(--j-card);color:var(--j-ink);text-align:left;font:600 .82rem var(--j-sans);cursor:pointer}.results button:hover{border-color:var(--j-primary);background:#eaf8ee}.map-wrap{position:relative}#picker-map{height:min(58vh,520px);border:1px solid var(--j-line);border-radius:18px;overflow:hidden;background:#e9f8ee}.map-loading{position:absolute;inset:0;z-index:500;display:grid;place-items:center;border-radius:18px;background:rgba(244,246,245,.82);color:var(--j-ink);font-weight:700;pointer-events:none}.map-loading.done{display:none}.picker-note{margin:12px 0;padding:12px 14px;border-radius:12px;background:#fbf7ff;color:var(--j-muted);font-size:.86rem}.picker-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.picker-secondary{border:1px solid var(--j-line);background:var(--j-card);color:var(--j-ink)}@media(max-width:480px){.search,.picker-actions{grid-template-columns:1fr}.picker-head{align-items:center}.picker-head p{display:none}}</style></head><body><main class="picker"><div class="picker-head"><div><h1>Choose delivery location</h1><p style="margin:6px 0 0;color:var(--j-muted)">Search a place, tap the map, or drag the pin.</p></div><a class="jora-back" href="checkout.html" style="margin:0">← Back</a></div><form class="search" id="location-search"><input id="location-query" placeholder="Search area, street, landmark or PIN code" autocomplete="street-address"><button type="submit">Search</button></form><div class="results" id="location-results" aria-live="polite"></div><div class="map-wrap"><div id="picker-map" aria-label="Delivery location map"></div><div class="map-loading" id="map-loading">Loading map…</div></div><p class="picker-note" id="picker-note">Move the pin, then save your delivery location.</p><div class="picker-actions"><button class="picker-secondary" id="locate" type="button">Use my current location</button><button class="jora-button" id="save" type="button">Save delivery location</button></div></main><script>(function(){var lat=Number(localStorage.getItem('ls_del_lat')),lng=Number(localStorage.getItem('ls_del_lng')),note=document.getElementById('picker-note'),results=document.getElementById('location-results');if(!Number.isFinite(lat)||!Number.isFinite(lng)){lat=11.0168;lng=76.9558}var map=L.map('picker-map',{preferCanvas:true}).setView([lat,lng],15),marker=L.marker([lat,lng],{draggable:true}).addTo(map).bindPopup('Delivery here').openPopup();L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map).on('load',function(){document.getElementById('map-loading').classList.add('done')});setTimeout(function(){document.getElementById('map-loading').classList.add('done')},7000);function set(point,zoom){lat=Number(point.lat);lng=Number(point.lng);marker.setLatLng([lat,lng]);if(zoom)map.setView([lat,lng],zoom);note.textContent='Pinned: '+lat.toFixed(5)+', '+lng.toFixed(5)}map.on('click',function(e){set(e.latlng)});marker.on('dragend',function(){set(marker.getLatLng())});set({lat:lat,lng:lng});document.getElementById('location-search').onsubmit=async function(e){e.preventDefault();var q=document.getElementById('location-query').value.trim();if(q.length<3){results.textContent='Enter at least 3 characters to search.';return}results.textContent='Searching locations…';try{var r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=in&q='+encodeURIComponent(q),{headers:{Accept:'application/json'}}),list=await r.json();results.innerHTML='';if(!list.length){results.textContent='No matching location found. Try a nearby landmark or PIN code.';return}list.forEach(function(item){var b=document.createElement('button');b.type='button';b.textContent=item.display_name;b.onclick=function(){set({lat:item.lat,lng:item.lon},16);results.innerHTML='';document.getElementById('location-query').value=item.display_name};results.appendChild(b)})}catch(err){results.textContent='Location search is unavailable. Check your connection and try again.'}};document.getElementById('locate').onclick=function(){if(!navigator.geolocation){note.textContent='Location access is unavailable. Search or move the pin manually.';return}note.textContent='Finding your location…';navigator.geolocation.getCurrentPosition(function(p){set({lat:p.coords.latitude,lng:p.coords.longitude},16)},function(){note.textContent='Could not detect your location. Search or move the pin manually.'},{enableHighAccuracy:true,timeout:10000,maximumAge:300000})};document.getElementById('save').onclick=function(){localStorage.setItem('ls_del_lat',String(lat));localStorage.setItem('ls_del_lng',String(lng));location.replace('checkout.html')};}())</script></body></html>
