<html lang="en">

  <title>Shop | Jora</title>
  <meta name="description" content="Browse a nearby Zorra shop, view vendor products and order locally.">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#D99A19;--gold-dark:#A86D08;--gold-pale:#FFF4D8;--violet:#5A12D6;--violet-light:#8B31FF;--violet-deep:#2A073F;--black:#170722;--mid:#6F637A;--light:#FCF8FF;--white:#fff;--border:rgba(217,154,25,.52);--ff:'Playfair Display',Georgia,serif;--fb:'Outfit',system-ui,sans-serif;--shadow:0 22px 54px rgba(42,7,63,.12),0 8px 20px rgba(217,154,25,.10)}
body{font-family:var(--fb);background:radial-gradient(circle at 8% 8%,rgba(243,196,92,.34),transparent 24%),radial-gradient(circle at 88% 8%,rgba(139,49,255,.18),transparent 27%),linear-gradient(180deg,#fff 0%,#FCF8FF 48%,#FFF6DF 100%);color:var(--black);min-height:100vh}
nav{position:sticky;top:0;z-index:10;padding:14px 20px}
.nav-inner{max-width:1180px;margin:auto;height:68px;border:1.5px solid var(--border);border-radius:26px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:14px}
.logo{font-family:var(--ff);font-size:1.45rem;font-weight:900;text-decoration:none;color:var(--violet-deep)}.logo span{color:var(--violet)}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--mid);font-weight:800;border:1px solid rgba(90,18,214,.12);background:#fff;border-radius:999px;padding:9px 15px}
.page{max-width:1180px;margin:0 auto;padding:22px 20px 70px}
.hero{display:grid;grid-template-columns:360px minmax(0,1fr);gap:28px;align-items:stretch;margin-bottom:28px}
.shop-media{min-height:300px;border-radius:30px;overflow:hidden;background:linear-gradient(135deg,var(--violet-deep),var(--violet));box-shadow:var(--shadow);position:relative}
.shop-media img{width:100%;height:100%;object-fit:cover;display:block}
.shop-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--ff);font-size:4rem;font-weight:900}
.shop-info{border:1.5px solid var(--border);border-radius:30px;background:rgba(255,255,255,.92);box-shadow:var(--shadow);padding:30px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:.7rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--violet);margin-bottom:12px}
h1{font-family:var(--ff);font-size:2.6rem;line-height:1.04;color:var(--violet-deep);margin-bottom:12px;text-shadow:1px 1px 0 rgba(243,196,92,.35)}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#fff;border:1px solid rgba(90,18,214,.14);padding:8px 12px;color:var(--violet-deep);font-weight:800;font-size:.84rem}
.offer{font-size:1rem;line-height:1.7;color:var(--mid);max-width:680px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{border:0;border-radius:999px;background:linear-gradient(135deg,var(--violet),var(--violet-light));color:#fff;font-family:var(--fb);font-weight:900;padding:12px 18px;text-decoration:none;box-shadow:0 14px 28px rgba(90,18,214,.22)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark))}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:28px 0 16px}
.section-head h2{font-family:var(--ff);font-size:1.7rem;color:var(--violet-deep)}
.count{color:var(--mid);font-weight:800}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1.5px solid var(--gold);border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 18px 36px rgba(42,7,63,.08);transition:.2s;position:relative}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--violet)}
.pic{aspect-ratio:1/1.05;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--violet);font-family:var(--ff);font-weight:900;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .28s}
.card:hover .pic img{transform:scale(1.04)}
.wish{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);background:rgba(255,255,255,.94);color:var(--violet);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(42,7,63,.10)}
.wish svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.body{padding:14px;display:flex;flex-direction:column;gap:7px;flex:1;background:linear-gradient(180deg,#fff,#FCF8FF)}
.shopline{font-size:.76rem;color:#00796B;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-weight:900;color:var(--violet-deep);font-size:.98rem;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--mid);font-weight:700;line-height:1.35}
.price-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-size:1rem;font-weight:900;color:var(--violet-deep)}
.old-price{font-size:.78rem;font-weight:700;color:#9A8EA8;text-decoration:line-through}
.foot{margin-top:auto;padding-top:6px}
.view{width:100%;display:flex;align-items:center;justify-content:center;border-radius:14px;border:1px solid rgba(217,154,25,.62);background:linear-gradient(135deg,var(--violet),var(--violet-light));color:#fff;font-size:.9rem;font-weight:900;padding:11px 14px;box-shadow:0 12px 24px rgba(90,18,214,.22)}
.empty{display:none;text-align:center;border:1.5px solid var(--border);border-radius:24px;background:#fff;padding:42px 18px;color:var(--mid);font-weight:800}
.not-found{max-width:620px;margin:70px auto;text-align:center;border:1.5px solid var(--border);border-radius:28px;background:#fff;padding:42px 22px;box-shadow:var(--shadow)}
.not-found h1{font-size:1.8rem}
@media(max-width:820px){.hero{grid-template-columns:1fr}.shop-media{min-height:220px}h1{font-size:2rem}.nav-inner{padding:0 14px}.logo{font-size:1.2rem}.products{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}

/* Final violet-gold brand and responsive fit */
.nav-inner{
  border:2px solid var(--gold);
  background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,244,216,.88),rgba(244,235,255,.92));
}
.logo{
  font-family:var(--ff);
  font-size:1.62rem;
  font-weight:900;
  letter-spacing:.01em;
  text-shadow:1px 1px 0 rgba(217,154,25,.46);
  white-space:nowrap;
}
.logo span{color:var(--violet)}
.back,.shop-info,.card,.not-found,.empty,.chip,.view,.wish{
  border-color:var(--gold)!important;
}
.btn,.view{
  background:linear-gradient(135deg,var(--violet-deep),var(--violet-light))!important;
  border:1.5px solid var(--gold)!important;
}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark))!important;color:#21082F!important}

@media(max-width:820px){
  html,body{width:100%;max-width:100%;overflow-x:hidden}
  nav{padding:8px 10px}
  .nav-inner{
    height:auto;
    min-height:62px;
    padding:10px;
    gap:8px;
    border-radius:22px;
    flex-wrap:wrap;
  }
  .logo{
    flex:1 1 100%;
    justify-content:center;
    font-size:clamp(1.32rem,7vw,1.72rem);
  }
  .back{
    flex:1 1 100%;
    justify-content:center;
    padding:10px 12px;
  }
  .page{padding:14px 12px 58px}
  .hero{gap:16px;margin-bottom:20px}
  .shop-info{padding:20px;border-radius:22px}
  .shop-media{border-radius:22px}
  h1{font-size:clamp(1.72rem,9vw,2.2rem)}
  .section-head{align-items:flex-start;flex-direction:column;gap:6px}
  .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .body{padding:12px}
}

@media(max-width:460px){
  .products{grid-template-columns:1fr}
  .actions{flex-direction:column}
  .btn{width:100%;justify-content:center;text-align:center}
}

.brand-inline{display:flex;width:100%;height:100%;align-items:center;justify-content:center;gap:7px;color:#fff;font-family:Arial,sans-serif;white-space:nowrap}.brand-speed{display:flex;flex-direction:column;align-items:flex-end;gap:4px;width:22px}.brand-speed i{display:block;height:2px;border-radius:9px;background:#ED1224}.brand-speed i:nth-child(1){width:11px}.brand-speed i:nth-child(2){width:17px}.brand-speed i:nth-child(3){width:22px}.brand-word{position:relative;font-size:1.35rem;font-weight:400;letter-spacing:.07em;line-height:1}.brand-word b{font-weight:900}.brand-x{position:relative;display:inline-block;margin:0 1px;font-weight:700}.brand-x span{position:relative;z-index:1}.brand-x::after{content:'';position:absolute;left:45%;top:-8px;width:4px;height:36px;border-radius:4px;background:#ED1224;transform:rotate(39deg)}

.actions .btn.gold{background:#111!important;border:1.5px solid #FFCC20!important;color:#fff!important;text-shadow:none!important}.actions .btn.gold:visited{color:#fff!important}.actions .btn.gold:hover{background:#FFCC20!important;border-color:#FFCC20!important;color:#111!important;box-shadow:0 12px 24px rgba(255,204,32,.22)!important}

</style>
