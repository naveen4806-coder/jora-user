<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2ECC71">
  <title>More | Jora</title>
  <link rel="stylesheet" href="jora-shell.css">
  <style>
    .jora-shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:480px}
    .jora-shortcuts a{display:flex;min-width:0;min-height:100px;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:12px 4px;border:1px solid var(--j-line);border-radius:16px;background:var(--j-card);box-shadow:var(--j-shadow);color:var(--j-ink);text-decoration:none;text-align:center;font-size:.78rem}
    .jora-shortcuts a:hover,.jora-shortcuts a:focus-visible{border-color:var(--j-primary-active);outline-color:var(--j-primary-active)}
    .jora-shortcut-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:#e4f9ec;color:#15803d;font-size:1.35rem;line-height:1}
    .jora-shortcuts a:nth-child(2) .jora-shortcut-icon{background:#fff2d6}.jora-shortcuts a:nth-child(3) .jora-shortcut-icon{background:#ffe9ef;color:#d63855;font-size:1.65rem}
  </style>
  <script src="jora-supabase-bridge.js"></script>
</head>
<body data-page="more">
  <div id="app"></div>
  <script src="jora-shell.js"></script>
  <script src="jora-more-page.js"></script>
</body>
</html>
