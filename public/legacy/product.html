    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback;}catch(e){return fallback;}}function toast(message){var el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.classList.remove('show');},2400);}function cart(){return read('ls_cart',{shopId:null,shopName:'',items:[]});}function saveCart(value){localStorage.setItem('ls_cart',JSON.stringify(value));updateCartCount();}function updateCartCount(){document.getElementById('cart-count').textContent=cart().items.reduce(function(n,item){return n+(Number(item.qty)||0);},0);}function price(v){return '₹'+(Number(v)||0).toLocaleString('en-IN');}
    async function loadProduct(){var products=read('ls_catalog_products',[]),shops=read('ls_catalog_shops',[]),last=read('ls_last_product',null);product=products.find(function(p){return p.id===productId;})||(last&&(!productId||last.id===productId)?last:null);if(!product&&productId){try{var doc=await db.collection('products').doc(productId).get();if(doc.exists)product=Object.assign({id:doc.id},doc.data());}catch(e){}}if(!product){document.getElementById('product-shell').classList.remove('skeleton');document.getElementById('product-shell').innerHTML='<div class="empty" style="grid-column:1/-1"><b>Product not found</b><br>Return to Zorra and choose a product again.</div>';return;}productId=product.id;shop=shops.find(function(s){return s.id===product.shopId;})||read('ls_last_shop',null);if(!shop&&product.shopId){try{var sdoc=await db.collection('shops').doc(product.shopId).get();if(sdoc.exists)shop=Object.assign({id:sdoc.id},sdoc.data());}catch(e){}}renderProduct();listenReviews();auth.onAuthStateChanged(checkVerifiedPurchase);}
    function renderProduct(){var shell=document.getElementById('product-shell'),stock=Number(product.stock==null?99:product.stock),image=product.image||product.imageUrl||product.photo||'',mrp=Number(product.mrp||product.originalPrice||0),rating=Number(product.rating||4.7);document.title=product.name+' | Zorra';document.getElementById('crumb-name').textContent=product.name;shell.classList.remove('skeleton');shell.innerHTML='<div class="gallery">'+(image?'<img src="'+esc(image)+'" alt="'+esc(product.name)+'" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'placeholder\',textContent:\'Z\'}))">':'<div class="placeholder">Z</div>')+'<span class="badge">'+esc(product.badge||'Zorra Choice')+'</span></div><div class="details"><a class="shop-link" href="shop.html?id='+encodeURIComponent(product.shopId||'')+'"><span class="shop-dot"></span>'+esc((shop&&shop.name)||product.shopName||'Zorra Vendor')+' →</a><div class="category">'+esc(product.category||'Product')+'</div><h1 class="name">'+esc(product.name)+'</h1><div class="rating-line"><span class="stars">★★★★★</span><b>'+rating.toFixed(1)+'</b><span id="hero-review-count">Customer rated</span></div><div class="price-row"><span class="price">'+price(product.price)+'</span>'+(mrp>Number(product.price)?'<span class="mrp">'+price(mrp)+'</span>':'')+'</div><span class="stock '+(stock<1?'out':'')+'">'+(stock<1?'Out of stock':stock+' available')+'</span><p class="description">'+esc(product.description||product.details||'Freshly listed by a trusted local Zorra vendor. Check availability and order for convenient local delivery.')+'</p><div class="purchase"><div class="qty"><button type="button" onclick="changeQty(-1)">−</button><span id="qty">1</span><button type="button" onclick="changeQty(1)">+</button></div><button class="add" type="button" onclick="addToCart(false)" '+(stock<1?'disabled':'')+'>Add to cart</button><button class="buy" type="button" onclick="addToCart(true)" '+(stock<1?'disabled':'')+'>Order now</button></div><div class="benefits"><div class="benefit"><b>Local delivery</b>Delivered from a nearby Zorra shop.</div><div class="benefit"><b>Secure ordering</b>Uses your existing Zorra checkout.</div><div class="benefit"><b>Customer support</b>Order tracking and help included.</div></div></div>';updateCartCount();}
    function changeQty(delta){var el=document.getElementById('qty'),stock=Number(product.stock==null?99:product.stock),next=Math.max(1,Math.min(stock,Number(el.textContent)+delta));el.textContent=next;}function addToCart(orderNow){var value=cart(),qty=Number(document.getElementById('qty').textContent)||1,stock=Number(product.stock==null?99:product.stock),shopId=product.shopId||'',shopName=(shop&&shop.name)||product.shopName||'Zorra Shop';if(value.shopId&&value.shopId!==shopId&&!confirm('Your cart contains products from another shop. Clear it and order this product?'))return;if(value.shopId&&value.shopId!==shopId)value={shopId:null,shopName:'',items:[]};value.shopId=shopId;value.shopName=shopName;var item=value.items.find(function(i){return i.productId===product.id;});if(item)item.qty=Math.min(stock,item.qty+qty);else value.items.push({productId:product.id,name:product.name,price:Number(product.price)||0,qty:qty,image:product.image||'',category:product.category||'',stock:stock});saveCart(value);toast(orderNow?'Opening order checkout…':'Added to cart');if(orderNow)setTimeout(function(){location.href='home.html?buyNow=1';},450);}
    function buildStars(){var el=document.getElementById('star-picker');el.innerHTML=[1,2,3,4,5].map(function(n){return'<button type="button" class="'+(n<=selectedRating?'on':'')+'" onclick="chooseRating('+n+')" aria-label="'+n+' stars" '+(!verifiedPurchase?'disabled':'')+'>★</button>';}).join('');}window.chooseRating=function(n){if(!verifiedPurchase)return;selectedRating=n;buildStars();};function localReviews(){return read('zorra_reviews_'+productId,[]);}function saveLocalReview(review){var list=localReviews();list.unshift(review);localStorage.setItem('zorra_reviews_'+productId,JSON.stringify(list));reviews=list;renderReviews();}

    async function checkVerifiedPurchase(user){verifiedPurchase=false;purchaseCheckComplete=false;document.getElementById('review-eligibility').textContent=user?'Checking your delivered orders…':'Sign in to verify your purchase and write a review.';document.getElementById('review-comment').disabled=true;document.getElementById('submit-review').disabled=true;buildStars();if(!user){purchaseCheckComplete=true;return;}try{var snapshot=await db.collection('orders').where('customerUid','==',user.uid).get(),found=false;snapshot.forEach(function(doc){var order=doc.data()||{},status=String(order.status||'').toLowerCase(),delivered=status==='delivered'||order.customerConfirmed===true,items=Array.isArray(order.items)?order.items:[];if(delivered&&(String(order.productId||'')===String(productId)||items.some(function(item){return String(item.productId||item.id||'')===String(productId);})))found=true;});if(found)setReviewEligibility('Verified purchase — you can review this product.',true);else setReviewEligibility('Only customers with a delivered order for this product can write a review.',false);}catch(e){setReviewEligibility('We could not verify a delivered purchase. Reviews are temporarily unavailable.',false);}}
    function listenReviews(){try{db.collection('product_reviews').where('productId','==',productId).onSnapshot(function(snapshot){reviews=[];snapshot.forEach(function(doc){reviews.push(Object.assign({id:doc.id},doc.data()));});reviews.sort(function(a,b){return new Date(b.createdAt||0)-new Date(a.createdAt||0);});if(!reviews.length)reviews=localReviews();renderReviews();},function(){reviews=localReviews();renderReviews();});}catch(e){reviews=localReviews();renderReviews();}}
    function renderReviews(){var list=document.getElementById('review-list'),count=reviews.length,average=count?reviews.reduce(function(sum,r){return sum+(Number(r.rating)||0);},0)/count:0;document.getElementById('average-rating').textContent=count?average.toFixed(1):'—';document.getElementById('review-count').textContent=count+' review'+(count===1?'':'s');var hero=document.getElementById('hero-review-count');if(hero)hero.textContent=count?count+' customer review'+(count===1?'':'s'):'Be the first to review';if(!count){list.innerHTML='<div class="empty"><b>No reviews yet</b><br>Be the first customer to review this product.</div>';return;}list.innerHTML=reviews.map(function(r){var rating=Math.max(1,Math.min(5,Number(r.rating)||5)),name=r.userName||r.name||'Zorra Customer',date=r.createdAt&&r.createdAt.toDate?r.createdAt.toDate():new Date(r.createdAt||Date.now());return'<article class="review-card"><div class="review-top"><div class="reviewer"><span class="avatar">'+esc(name.charAt(0).toUpperCase())+'</span>'+esc(name)+'</div><span class="date">'+date.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+'</span></div><div class="review-stars">'+('★'.repeat(rating))+'<span style="color:#d7d9de">'+('★'.repeat(5-rating))+'</span></div><p class="review-comment">'+esc(r.comment||'')+'</p></article>';}).join('');}
    document.getElementById('review-form').addEventListener('submit',async function(event){event.preventDefault();var user=auth.currentUser;if(!user){if(confirm('Please sign in to verify your purchase and write a review. Open sign in?'))location.href='home.html?auth=login&return='+encodeURIComponent('product.html?id='+productId);return;}if(!purchaseCheckComplete){toast('Please wait while we verify your purchase');return;}if(!verifiedPurchase){toast('Only customers who received this product can review it');return;}var duplicate=reviews.some(function(review){return review.userId===user.uid;});if(duplicate){toast('You have already reviewed this product');return;}var comment=document.getElementById('review-comment').value.trim();if(comment.length<5){toast('Please write a little more about the product');return;}var review={productId:productId,shopId:product.shopId||'',userId:user.uid,userName:user.displayName||localStorage.getItem('ls_name')||'Zorra Customer',rating:selectedRating,comment:comment,createdAt:new Date().toISOString(),verifiedPurchase:true};try{await db.collection('product_reviews').add(Object.assign({},review,{createdAt:firebase.firestore.FieldValue.serverTimestamp()}));toast('Verified review submitted');document.getElementById('review-comment').value='';}catch(e){saveLocalReview(review);toast('Verified review saved on this device');document.getElementById('review-comment').value='';}});buildStars();updateCartCount();loadProduct();

;(function(){function rename(root){var w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT),n;while(n=w.nextNode()){if(n.parentElement&&/^(SCRIPT|STYLE)$/i.test(n.parentElement.tagName))continue;n.nodeValue=n.nodeValue.replace(/ZORRA/g,'JORA').replace(/Zorra/g,'Jora').replace(/zorra/g,'jora');}}rename();new MutationObserver(function(m){m.forEach(function(x){x.addedNodes.forEach(function(n){if(n.nodeType===1)rename(n);else if(n.nodeType===3&&n.parentElement&&!/^(SCRIPT|STYLE)$/i.test(n.parentElement.tagName))n.nodeValue=n.nodeValue.replace(/ZORRA/g,'JORA').replace(/Zorra/g,'Jora').replace(/zorra/g,'jora');});});}).observe(document.body,{childList:true,subtree:true});document.title=document.title.replace(/Zorra/g,'Jora');})();
